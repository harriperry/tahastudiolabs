<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{ROBOTS}}<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
{{OG_IMAGE}}<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="{{BRAND}}">
<style>
/* TAHA Studio Labs landing page template (Growth Department V2, phase G2b).
   One file, mobile first, no web fonts, no third-party requests, no cookies. */
:root{--brand:{{BRAND}};--on-brand:{{ON_BRAND}};--accent:{{ACCENT}};--on-accent:{{ON_ACCENT}};--ink:#1d1c1a;--soft:#5b5853;--paper:#fbfaf7;--card:#ffffff;--line:#e7e3dc;--radius:14px;--head:{{FONT_HEAD}};--body:{{FONT_BODY}}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);padding-bottom:84px}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(24px,5vw,34px);margin-bottom:18px}
p{margin:0 0 12px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;max-width:1080px;margin:0 auto}
.mark{font-family:var(--head);font-weight:800;font-size:18px;text-decoration:none;letter-spacing:.01em}
.top .tel{font-size:15px;text-decoration:none;font-weight:600;color:var(--soft)}
.hero{position:relative;background:var(--brand);color:var(--on-brand)}
.hero-img{aspect-ratio:4/3;width:100%;object-fit:cover;max-height:46vh}
.hero-text{padding:28px 20px 34px}
.hero h1{font-size:clamp(32px,8.5vw,58px);font-weight:800;margin-bottom:12px}
.hero .sub{font-size:clamp(17px,4.4vw,21px);opacity:.92;margin-bottom:22px;max-width:34ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:17px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;line-height:1.2}
.btn-main{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn-ghost{background:transparent;color:inherit;border:2px solid currentColor}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
section{padding:46px 0}
.offer{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;box-shadow:0 10px 30px rgba(29,28,26,.06);margin-top:-22px;position:relative}
.kicker{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
.offer .big{font-family:var(--head);font-size:clamp(22px,5.4vw,30px);font-weight:700;line-height:1.25;margin-bottom:14px}
.ends{display:inline-block;background:var(--brand);color:var(--on-brand);padding:6px 12px;border-radius:999px;font-weight:700;font-size:15px;margin:4px 0 14px}
.terms{color:var(--soft);font-size:15px}
.reasons{display:grid;gap:16px}
.reason{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.reason .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:800;margin-bottom:12px}
.reason h3{font-size:20px;margin-bottom:8px}
.reason p{color:var(--soft);margin:0}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--line)}
.quotes{display:grid;gap:14px}
blockquote{margin:0;background:var(--card);border-left:5px solid var(--accent);border-radius:10px;padding:18px 20px;font-size:18px}
.visit{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts{display:grid;gap:14px;margin-bottom:22px}
.fact b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 180px}
.btn-line{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
form{display:grid;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
label{font-weight:700;font-size:15px;display:block;margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;font:inherit;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}
.check input{margin-top:4px;width:20px;height:20px;flex:none}
.purpose{font-size:14px;color:var(--soft);margin:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sent{display:none;background:#e7f4ec;border:1px solid #9fcdb2;color:#14532d;border-radius:10px;padding:14px 16px;font-weight:600}
#sent:target{display:block}
footer{padding:36px 0 30px;color:var(--soft);font-size:15px}
footer .co{color:var(--ink);font-weight:700}
details{margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
details p,details li{font-size:14px}
details ul{padding-left:18px;margin:8px 0}
.by{margin-top:18px;font-size:13px}
.by a{text-decoration:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(251,250,247,.96);border-top:1px solid var(--line);display:flex;gap:10px;z-index:5}
.bar .btn{flex:1;min-height:50px}
.ended .hero-img{filter:grayscale(.55) brightness(.75)}
.ended-note{font-size:19px}
@media (min-width:760px){
  body{padding-bottom:0}
  .bar{display:none}
  .hero{display:block;min-height:560px}
  .hero-img{position:absolute;inset:0;height:100%;max-height:none;aspect-ratio:auto}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--brand) 0%,var(--brand) 38%,transparent 72%);opacity:.94}
  .hero-text{position:relative;z-index:1;width:52%;padding:96px 0 110px 40px;max-width:560px}
  .hero.no-img .hero-text{width:auto;max-width:760px}
  .hero.no-img::after{display:none}
  .offer{padding:34px 36px;margin-top:-40px}
  .reasons{grid-template-columns:repeat(3,1fr)}
  .gallery{grid-template-columns:repeat(3,1fr)}
  .quotes{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:repeat(3,1fr)}
  form{grid-template-columns:1fr 1fr}
  form .full{grid-column:1/-1}
}
@media (min-width:1100px){.hero-text{padding-left:max(40px,calc((100vw - 1080px)/2 + 20px))}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
{{JSON_LD}}
</head>
<body class="{{BODY_CLASS}}">
<header class="top"><span class="mark">{{COMPANY}}</span>{{TOP_LINK}}</header>
<main>
{{MAIN}}
</main>
<footer><div class="wrap">
{{FOOTER}}
</div></footer>
{{BAR}}
{{TRACKER}}
</body>
</html>
