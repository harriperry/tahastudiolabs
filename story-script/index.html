<body>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
// Local persistence shim — replaces Claude.ai's window.storage with plain localStorage
// so this app runs standalone, outside the Claude artifact sandbox.
(function () {
  const NS = "ssps:";
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(NS + key);
      return { value: v };
    },
    async set(key, value) {
      localStorage.setItem(NS + key, value);
    },
    async delete(key) {
      localStorage.removeItem(NS + key);
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(NS + prefix)) keys.push(k.slice(NS.length));
      }
      return { keys };
    }
  };
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

const STAGES = [
  { label:"Scripted",    color:"#4b5563", icon:"📝" },
  { label:"Image Done",  color:"#3b82f6", icon:"🖼️" },
  { label:"Video Done",  color:"#f59e0b", icon:"🎥" },
  { label:"VO Done",     color:"#a855f7", icon:"🎙️" },
  { label:"Edited",      color:"#10b981", icon:"✂️" },
  { label:"Published",   color:"#22c55e", icon:"🚀" },
];

const GENRE_COLORS = { Drama:"#a855f7",Thriller:"#ef4444",Comedy:"#f59e0b",Romance:"#ec4899",Action:"#f97316",Horror:"#dc2626","Sci-Fi":"#3b82f6",Fantasy:"#10b981",Mystery:"#06b6d4" };
const genreColor = (g="") => { const m=Object.keys(GENRE_COLORS).find(k=>g.toLowerCase().includes(k.toLowerCase())); return m?GENRE_COLORS[m]:"#6b7280"; };
const cp = (t) => navigator.clipboard.writeText(t).catch(()=>{});

const ANTHROPIC_HEADERS = (key) => ({
  "Content-Type": "application/json",
  "x-api-key": key,
  "anthropic-version": "2023-06-01",
  "anthropic-dangerous-direct-browser-access": "true"
});

const buildSystemPrompt = (context, chars) => {
  const charBlock = chars?.length
    ? `\n## CHARACTER REGISTRY — USE CONSISTENTLY IN ALL SCENES\n${chars.map(c=>`- ${c.name} (${c.role}): ${c.appearance}. Voice: ${c.voiceTone}. Accent: ${c.accent}. Personality: ${c.personality}.`).join("\n")}\n`
    : "";
  return `You are an elite story writer, cinematographer, and AI video production expert specialising in short-form Facebook video content. ${charBlock}${context?`\n## ESTABLISHED STORY WORLD — TREAT AS CANON\n${context}\n`:""}
## MANDATORY STORYTELLING RULES
1. HOOK FIRST: Open every story by revealing the emotional endpoint or consequence BEFORE telling the story. The audience must feel the weight of what happened before they see how. Spark instant curiosity that compels them to watch every scene. Example: begin with the feeling — "This is the moment everything changed..." — then take them back.
2. PRESENT TENSE: Write ALL events in present tense even when describing the past. "She walks in" not "She walked in." Always.
3. NATURAL DIALOGUE: Write like two real people talking in a real place. No AI patterns. No perfect sentences. Include natural hesitations, reactions, interruptions. It must never sound scripted.
4. SOUND EFFECTS & REACTIONS: Every scene must feel alive. Include ambient SFX inside scene_description as [SFX: description] — footsteps on tile, door clicking shut, distant crowd, wind through a window, a chair scraping. Also populate the sfx_prompt field with precise audio production directions. SFX must be subtle — never louder than the dialogue or story emotion.
5. PAUSES: Use "..." in dialogue for natural breath and timing. NEVER use em-dashes (—) inside dialogue or sentences. Not once.
6. CHARACTER REACTIONS: Every scene must include at least one visible reaction — a flinch, a silence, a laugh, a look away. The body always responds.
7. ENDING WITH REACTION: The final scene closes with a reaction — not an explanation. The audience must feel the story has fully landed. Completion, not abandonment.

## DIALOGUE TIMING — HARD LIMIT: 18 SPOKEN WORDS PER SCENE
At natural conversational pace of 120 words per minute, 9 seconds = exactly 18 spoken words. Count ONLY the words spoken after TTS: labels and after reply colons — NEVER count the tone descriptions inside asterisks. If spoken words exceed 18, cut until they don't. Every word must earn its place.

When given a story idea or production brief, return ONLY a valid JSON object (no markdown, no backticks, no preamble):
{"title":"...","synopsis":"2-3 sentence emotional hook — open with the end feeling first","genre":"Drama/Thriller/etc","universal_t2i_prompt":"[Art style],[characters],[palette],[lighting],[mood],[camera], cinematic, high detail, consistent character design, storyboard sheet","scenes":[{"scene_number":1,"scene_title":"...","scene_description":"Vivid 2-3 sentences: setting, time, mood, atmosphere. Weave in [SFX: ambient sounds] naturally.","dialogue":"[Name] said *(vivid ElevenLabs-ready tone)* TTS: (spoken message — count these words). [Name] replied *(tone and accent)*: (spoken reply — count these words). Total spoken words across both turns must not exceed 18. Use ... for pauses. Never use em-dashes.","sfx_prompt":"Precise sound design brief for this scene: ambient layers, action-triggered SFX, emotional audio cues. Production-ready for audio editors.","i2v_prompt":"Camera movement, scene motion, environmental animation, cinematic technique","kinetic_prompt":"Character gestures, facial expressions, physical actions, emotional physicality — include reactions","continuity_prompt":"Bridge to next scene: lighting transition, emotional arc, camera handoff, mood shift"}]}
CRITICAL: All 7 storytelling rules are non-negotiable. 18 spoken words hard limit. SFX in every scene. Present tense throughout. No em-dashes ever. End on a reaction. Optimised for Facebook vertical video.`;
};

const extractSpoken = (d) => {
  if(!d||d.toUpperCase().startsWith("SILENT")) return null;
  return d.replace(/\*[^*]+\*/g,"").replace(/TTS:\s*/gi,"").replace(/\b\w[\w ]*\b\s+said\s*/gi,"").replace(/\b\w[\w ]*\b\s+replied\s*/gi,"").replace(/:\s*/g,". ").replace(/\s+/g," ").trim();
};

const sceneToText = (s) => `━━━━━━━━━━━━━━━━━━━━━━━━━
SCENE ${s.scene_number} — ${s.scene_title}
━━━━━━━━━━━━━━━━━━━━━━━━━
🎬 SCENE DESCRIPTION
${s.scene_description}

💬 DIALOGUE (9s)
${s.dialogue}

🎥 I2V PROMPT
${s.i2v_prompt}

🏃 KINETIC PROMPT
${s.kinetic_prompt}

🔗 CONTINUITY PROMPT
${s.continuity_prompt}`;

// ── CopyBtn ───────────────────────────────────────────────────────────────────
const CopyBtn = ({ text, label="Copy", ok="✓ Copied" }) => {
  const [c,setC]=useState(false);
  return <button onClick={()=>{cp(text);setC(true);setTimeout(()=>setC(false),1600);}} style={{background:c?"#22c55e":"#374151",border:"none",borderRadius:6,color:"#fff",fontSize:11,padding:"3px 10px",cursor:"pointer",transition:"background .2s",whiteSpace:"nowrap"}}>{c?ok:label}</button>;
};

// ── TTS Copy Button ───────────────────────────────────────────────────────────
const TTSPlayer = ({ dialogue }) => {
  const [state, setState] = useState("idle"); // idle | copied | silent
  const text = extractSpoken(dialogue);

  const handleCopy = () => {
    if (!text) { setState("silent"); setTimeout(() => setState("idle"), 2000); return; }
    cp(text);
    setState("copied");
    setTimeout(() => setState("idle"), 2000);
  };

  const colors = {
    idle:   { bg:"#1e3a5f", border:"#3b82f6",   color:"#60a5fa"  },
    copied: { bg:"#064e3b", border:"#10b981",    color:"#34d399"  },
    silent: { bg:"#1f2937", border:"#4b5563",    color:"#6b7280"  },
  };
  const s = colors[state];
  const labels = { idle:"🎙️ Copy TTS", copied:"✓ Copied!", silent:"Silent scene" };

  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:5}}>
      <button onClick={handleCopy}
        style={{background:s.bg,border:`1px solid ${s.border}`,borderRadius:6,color:s.color,fontSize:11,padding:"3px 10px",cursor:"pointer",whiteSpace:"nowrap",transition:"all .2s"}}>
        {labels[state]}
      </button>
    </span>
  );
};

// ── Tracker Row ───────────────────────────────────────────────────────────────
const TrackerRow = ({ sceneNum, tracker, onChange }) => {
  const stage=tracker[sceneNum]??0;
  return <div style={{display:"flex",gap:4,flexWrap:"wrap",paddingTop:10,borderTop:"1px solid #1f2937",marginTop:6}}>
    {STAGES.map((s,i)=>(
      <button key={i} onClick={()=>onChange(sceneNum,i)}
        style={{background:stage===i?s.color:stage>i?s.color+"44":"#1f2937",border:`1px solid ${stage>=i?s.color:"#374151"}`,borderRadius:20,color:stage>=i?"#fff":"#6b7280",fontSize:10,fontWeight:stage===i?800:400,padding:"3px 9px",cursor:"pointer",whiteSpace:"nowrap",transition:"all .15s"}}>
        {s.icon} {s.label}
      </button>
    ))}
  </div>;
};

// ── Scene Card ──────────────────────────────────────────────────────────────────
const SceneCard = ({ scene, total, tracker, onStageChange, onRegen, elApiKey, elVoiceId }) => {
  const pal=["#f59e0b","#10b981","#3b82f6","#a855f7","#ef4444","#06b6d4","#f97316","#ec4899"];
  const c=pal[(scene.scene_number-1)%pal.length];
  const [open,setOpen]=useState(true);
  const [regen,setRegen]=useState(false);
  const doRegen=async()=>{setRegen(true);await onRegen(scene.scene_number);setRegen(false);};
  const Row=({icon,label,value})=>(
    <div style={{marginBottom:13}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span style={{fontSize:11,fontWeight:700,color:c,textTransform:"uppercase",letterSpacing:1}}>{icon} {label}</span>
        <CopyBtn text={value}/>
      </div>
      <div style={{background:"#070d1a",border:`1px solid ${c}22`,borderRadius:8,padding:"10px 13px",color:"#d1d5db",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{value}</div>
    </div>
  );
  return (
    <div style={{border:`1px solid ${c}55`,borderRadius:14,marginBottom:16,overflow:"hidden",boxShadow:`0 0 18px ${c}0d`}}>
      <div style={{background:`linear-gradient(135deg,${c}28,#1a2035)`,padding:"12px 15px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpen(o=>!o)}>
          <span style={{background:c,color:"#000",fontWeight:900,borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>{scene.scene_number}</span>
          <div>
            <div style={{color:"#fff",fontWeight:800,fontSize:14}}>{scene.scene_title}</div>
            <div style={{color:"#6b7280",fontSize:10}}>Scene {scene.scene_number} of {total} · {STAGES[tracker[scene.scene_number]??0].icon} {STAGES[tracker[scene.scene_number]??0].label}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
          <TTSPlayer dialogue={scene.dialogue}/>
          <button onClick={doRegen} disabled={regen} style={{background:regen?"#374151":"#1a2035",border:`1px solid ${c}88`,borderRadius:6,color:regen?"#6b7280":c,fontSize:11,padding:"3px 9px",cursor:regen?"not-allowed":"pointer",whiteSpace:"nowrap"}}>{regen?"⏳ Rewriting...":"🔄 Regen"}</button>
          <CopyBtn text={sceneToText(scene)} label="📋 Copy" ok="✓!"/>
          <span onClick={()=>setOpen(o=>!o)} style={{color:c,fontSize:16,cursor:"pointer"}}>{open?"▲":"▼"}</span>
        </div>
      </div>
      {open&&(
        <div style={{padding:"15px 15px 8px",background:"#0a1020"}}>
          <Row icon="🎬" label="Scene Description" value={scene.scene_description}/>
          <div style={{marginBottom:13}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div style={{display:"flex",alignItems:"center",gap:7}}>
                <span style={{fontSize:11,fontWeight:700,color:c,textTransform:"uppercase",letterSpacing:1}}>💬 Dialogue</span>
                {(()=>{
                  const spoken=extractSpoken(scene.dialogue);
                  if(!spoken) return null;
                  const words=spoken.split(/\s+/).filter(Boolean).length;
                  const secs=(words/2).toFixed(1);
                  const ok=words<=18;
                  return <span style={{background:ok?"#064e3b":"#7f1d1d",color:ok?"#34d399":"#fca5a5",borderRadius:20,fontSize:10,fontWeight:700,padding:"1px 8px",whiteSpace:"nowrap"}}>{words}w · ~{secs}s</span>;
                })()}
              </div>
              <CopyBtn text={scene.dialogue}/>
            </div>
            <div style={{background:`linear-gradient(135deg,${c}18,#0d1a2e)`,border:`1px solid ${c}55`,borderRadius:10,padding:"12px 14px",color:"#fff",fontSize:14,lineHeight:1.7,fontStyle:"italic",fontWeight:600}}>"{scene.dialogue}"</div>
            <TTSPlayer dialogue={scene.dialogue}/>
          </div>
          {scene.sfx_prompt&&<Row icon="🔊" label="SFX / Sound Design" value={scene.sfx_prompt}/>}
          <Row icon="🎥" label="I2V Prompt" value={scene.i2v_prompt}/>
          <Row icon="🏃" label="Kinetic Prompt" value={scene.kinetic_prompt}/>
          <Row icon="🔗" label="Continuity Prompt" value={scene.continuity_prompt}/>
          <TrackerRow sceneNum={scene.scene_number} tracker={tracker} onChange={onStageChange}/>
        </div>
      )}
    </div>
  );
};

// ── Facebook Generator ────────────────────────────────────────────────────────
const FBGen = ({ data, anthropicKey }) => {
  const [open,setOpen]=useState(false);
  const [res,setRes]=useState(null);
  const [loading,setLoading]=useState(false);
  const gen=async()=>{
    if(!anthropicKey){alert("Add your Anthropic API key in Settings (⚙️) first.");setOpen(false);return;}
    setLoading(true);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:ANTHROPIC_HEADERS(anthropicKey),
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          system:`You are a Facebook viral content strategist. Return ONLY valid JSON (no markdown): {"hook":"Single scroll-stopping opening line — max 12 words, pure emotion or curiosity, no hashtags","caption":"3-4 short paragraphs, emotional storytelling tone, ends with a question to drive comments","cta":"One strong call-to-action line","hashtags":"10 relevant hashtags as a single string"}`,
          messages:[{role:"user",content:`Story: "${data.title}" (${data.genre})\nSynopsis: ${data.synopsis}\n\nWrite a viral Facebook video post.`}]
        })
      });
      const j=await r.json();
      setRes(JSON.parse(j.content?.find(b=>b.type==="text")?.text.replace(/```json|```/g,"").trim()));
    }catch(e){alert("Failed: "+e.message);}
    setLoading(false);
  };
  const fullPost=res?`${res.hook}\n\n${res.caption}\n\n${res.cta}\n\n${res.hashtags}`:"";
  return(
    <div style={{background:"#070f1f",border:"1px solid #1d4ed844",borderRadius:14,padding:16,marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:"#60a5fa",fontWeight:800,fontSize:12,textTransform:"uppercase",letterSpacing:1}}>📱 Facebook Caption &amp; Hook</span>
        <button onClick={()=>{if(!open){setOpen(true);if(!res)gen();}else setOpen(false);}} style={{background:"linear-gradient(135deg,#1d4ed8,#2563eb)",border:"none",borderRadius:8,color:"#fff",fontSize:12,fontWeight:700,padding:"5px 13px",cursor:"pointer"}}>
          {open?"Hide":"Generate Post ▶"}
        </button>
      </div>
      {open&&(
        <div style={{marginTop:14}}>
          {loading&&<div style={{color:"#60a5fa",fontSize:13}}>✍️ Crafting your Facebook post...</div>}
          {res&&!loading&&(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {[{l:"🪝 Hook",v:res.hook},{l:"📝 Caption",v:res.caption},{l:"📣 CTA",v:res.cta},{l:"# Hashtags",v:res.hashtags}].map(({l,v})=>(
                <div key={l}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span style={{color:"#60a5fa",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>{l}</span>
                    <CopyBtn text={v}/>
                  </div>
                  <div style={{background:"#111827",border:"1px solid #1f2937",borderRadius:8,padding:"9px 12px",color:"#d1d5db",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{v}</div>
                </div>
              ))}
              <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
                <CopyBtn text={fullPost} label="📋 Copy Full Post" ok="✓ Post Copied!"/>
                <button onClick={gen} style={{background:"transparent",border:"1px solid #374151",borderRadius:6,color:"#6b7280",fontSize:11,padding:"3px 10px",cursor:"pointer"}}>↺ Redo</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

// ── Story View ────────────────────────────────────────────────────────────────
const StoryView = ({ data, onSave, elApiKey, elVoiceId, anthropicKey, tracker, onStageChange }) => {
  const [editMode,setEditMode]=useState(false);
  const [drafts,setDrafts]=useState({});
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [adding,setAdding]=useState(false);
  const [addMsg,setAddMsg]=useState("");

  const enterEdit=()=>{const d={};data.scenes?.forEach(s=>{d[s.scene_number]=s.dialogue;});setDrafts(d);setEditMode(true);setSaved(false);};
  const saveEdits=async()=>{setSaving(true);await onSave({...data,scenes:data.scenes.map(s=>({...s,dialogue:drafts[s.scene_number]??s.dialogue}))});setSaving(false);setSaved(true);setEditMode(false);};

  const addTwoScenes=async()=>{
    if(!anthropicKey){setAddMsg("⚠️ Add your Anthropic API key in Settings first.");setTimeout(()=>setAddMsg(""),4000);return;}
    setAdding(true);setAddMsg("✍️ Writing 2 new scenes...");
    const sum=data.scenes.map(s=>`Scene ${s.scene_number} — ${s.scene_title}: ${s.scene_description}`).join("\n");
    const last=data.scenes[data.scenes.length-1];
    const next=(last?.scene_number||data.scenes.length)+1;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:ANTHROPIC_HEADERS(anthropicKey),
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,
          system:`Write exactly 2 continuation scenes. Return ONLY a JSON array of 2 objects (no markdown): [{"scene_number":${next},"scene_title":"...","scene_description":"...","dialogue":"[Name] said *(tone)* TTS: (msg). [Name] replied *(tone)*: (reply).","i2v_prompt":"...","kinetic_prompt":"...","continuity_prompt":"..."}] Numbers start at ${next}. Match story's arc and visual style exactly.`,
          messages:[{role:"user",content:`Story: "${data.title}" (${data.genre})\nSynopsis: ${data.synopsis}\n\nScenes:\n${sum}\n\nLast continuity: ${last?.continuity_prompt||"N/A"}`}]
        })
      });
      const j=await r.json();
      const ns=JSON.parse(j.content?.find(b=>b.type==="text")?.text.replace(/```json|```/g,"").trim());
      await onSave({...data,scenes:[...data.scenes,...ns]});
      setAddMsg("✅ 2 scenes added!");setTimeout(()=>setAddMsg(""),3000);
    }catch(e){setAddMsg("⚠️ "+e.message.slice(0,50));setTimeout(()=>setAddMsg(""),4000);}
    setAdding(false);
  };

  const regenScene=async(num)=>{
    if(!anthropicKey){alert("Add your Anthropic API key in Settings first.");return;}
    const s=data.scenes.find(x=>x.scene_number===num);
    const prev=data.scenes.find(x=>x.scene_number===num-1);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:ANTHROPIC_HEADERS(anthropicKey),
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,
          system:`Rewrite ONE scene. Return ONLY a single JSON scene object (no markdown, no array): {"scene_number":${num},"scene_title":"...","scene_description":"...","dialogue":"[Name] said *(tone)* TTS: (msg). [Name] replied *(tone)*: (reply).","i2v_prompt":"...","kinetic_prompt":"...","continuity_prompt":"..."}`,
          messages:[{role:"user",content:`Story: "${data.title}" (${data.genre})\nSynopsis: ${data.synopsis}\nPrev continuity: ${prev?.continuity_prompt||"N/A"}\n\nRewrite scene ${num}: "${s?.scene_title}" — fresh approach, same story position.`}]
        })
      });
      const j=await r.json();
      const ns=JSON.parse(j.content?.find(b=>b.type==="text")?.text.replace(/```json|```/g,"").trim());
      await onSave({...data,scenes:data.scenes.map(x=>x.scene_number===num?ns:x)});
    }catch(e){alert("Regen failed: "+e.message);}
  };

  const activeData=editMode?{...data,scenes:data.scenes.map(s=>({...s,dialogue:drafts[s.scene_number]??s.dialogue}))}:data;
  const fullScript=`${activeData.title.toUpperCase()}\n${activeData.genre} · ${activeData.scenes?.length} Scenes\n\n${activeData.synopsis}\n\n🖼️ UNIVERSAL T2I PROMPT\n${activeData.universal_t2i_prompt}\n\n${"━".repeat(28)}\n\n${activeData.scenes?.map(s=>sceneToText(s)).join("\n\n")}`;
  const published=Object.values(tracker).filter(v=>v===5).length;

  return(
    <div>
      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#1e1b4b,#111827)",border:"1px solid #4338ca44",borderRadius:16,padding:20,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{color:"#818cf8",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:3}}>{data.genre}</div>
            <h2 style={{margin:0,fontSize:20,fontWeight:900,color:"#fff"}}>{data.title}</h2>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
            <span style={{background:"#4338ca",color:"#fff",borderRadius:20,padding:"3px 12px",fontSize:11,fontWeight:700}}>{data.scenes?.length} Scenes</span>
            {!editMode&&!adding&&<button onClick={addTwoScenes} style={{background:"linear-gradient(135deg,#7c3aed,#4338ca)",border:"none",borderRadius:8,color:"#fff",fontSize:11,fontWeight:700,padding:"5px 11px",cursor:"pointer"}}>➕ Add 2</button>}
            {!editMode&&<button onClick={enterEdit} style={{background:"#1e3a5f",border:"1px solid #3b82f6",borderRadius:8,color:"#60a5fa",fontSize:11,fontWeight:700,padding:"5px 11px",cursor:"pointer"}}>✏️ Edit Dialogues</button>}
            {editMode&&<><button onClick={saveEdits} disabled={saving} style={{background:"linear-gradient(135deg,#10b981,#059669)",border:"none",borderRadius:8,color:"#fff",fontSize:11,fontWeight:700,padding:"5px 11px",cursor:"pointer"}}>{saving?"Saving...":"💾 Save"}</button><button onClick={()=>setEditMode(false)} style={{background:"transparent",border:"1px solid #374151",borderRadius:8,color:"#9ca3af",fontSize:11,padding:"4px 9px",cursor:"pointer"}}>Cancel</button></>}
            {!editMode&&<CopyBtn text={fullScript} label="📋 Full Script" ok="✓ Copied!"/>}

        </div>
        <p style={{color:"#a5b4fc",marginTop:10,marginBottom:0,lineHeight:1.65,fontSize:13}}>{data.synopsis}</p>
        {(saved||addMsg)&&<div style={{marginTop:7,fontSize:12,fontWeight:700,color:addMsg?.startsWith("⚠️")?"#fca5a5":"#34d399"}}>{saved&&!addMsg?"✅ Dialogues saved.":addMsg}</div>}
        {/* Progress */}
        {data.scenes?.length>0&&(
          <div style={{marginTop:10,display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{color:"#6b7280",fontSize:10,fontWeight:700}}>PROGRESS:</span>
            {STAGES.map((s,i)=>{const cnt=Object.values(tracker).filter(v=>v===i).length;return cnt>0?<span key={i} style={{background:s.color+"33",border:`1px solid ${s.color}`,borderRadius:20,color:s.color,fontSize:10,fontWeight:700,padding:"2px 7px"}}>{s.icon} {s.label} {cnt}</span>:null;})}
            {published>0&&<span style={{color:"#22c55e",fontSize:10,fontWeight:700,marginLeft:4}}>{published}/{data.scenes.length} published ✓</span>}
          </div>
        )}
      </div>

      {/* Edit panel */}
      {editMode&&(
        <div style={{background:"#0a1a2e",border:"1px solid #3b82f655",borderRadius:14,padding:18,marginBottom:18}}>
          <div style={{color:"#60a5fa",fontWeight:800,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>✏️ Edit Dialogues Only</div>
          {data.scenes?.map(s=>{const pal=["#f59e0b","#10b981","#3b82f6","#a855f7","#ef4444","#06b6d4","#f97316","#ec4899"];const c=pal[(s.scene_number-1)%pal.length];return(
            <div key={s.scene_number} style={{marginBottom:11}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:5}}>
                <span style={{background:c,color:"#000",fontWeight:900,borderRadius:6,width:24,height:24,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>{s.scene_number}</span>
                <span style={{color:c,fontWeight:700,fontSize:12}}>{s.scene_title}</span>
              </div>
              <textarea value={drafts[s.scene_number]||""} onChange={e=>setDrafts(d=>({...d,[s.scene_number]:e.target.value}))} rows={3}
                style={{width:"100%",background:"#070d1a",border:`1px solid ${c}44`,borderRadius:8,color:"#e5e7eb",fontSize:13,padding:"9px 12px",lineHeight:1.6,resize:"vertical",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
            </div>
          );})}
        </div>
      )}

      {/* Facebook Generator */}
      <FBGen data={data} anthropicKey={anthropicKey}/>

      {/* T2I */}
      <div style={{background:"#070d1a",border:"1px solid #f59e0b44",borderRadius:14,padding:15,marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
          <span style={{color:"#f59e0b",fontWeight:800,fontSize:12,textTransform:"uppercase",letterSpacing:1}}>🖼️ Universal T2I Filmstrip Prompt</span>
          <CopyBtn text={data.universal_t2i_prompt}/>
        </div>
        <div style={{color:"#d1d5db",fontSize:13,lineHeight:1.7}}>{data.universal_t2i_prompt}</div>
      </div>

      {/* Scenes */}
      <div style={{color:"#6b7280",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,marginBottom:14}}>Production Scenes</div>
      {activeData.scenes?.map(s=>(
        <SceneCard key={s.scene_number} scene={s} total={activeData.scenes.length}
          tracker={tracker} onStageChange={onStageChange} onRegen={regenScene}
          elApiKey={elApiKey} elVoiceId={elVoiceId}/>
      ))}
      <div style={{background:"linear-gradient(135deg,#064e3b,#065f46)",border:"1px solid #10b98155",borderRadius:14,padding:15,textAlign:"center",marginTop:4}}>
        <div style={{color:"#34d399",fontWeight:800,fontSize:13,marginBottom:3}}>✅ Ready for Production</div>
        <div style={{color:"#6ee7b7",fontSize:12}}>MidJourney → Runway / Kling → ElevenLabs → CapCut / Premiere</div>
      </div>
    </div>
  );
};

// ── Character Registry ────────────────────────────────────────────────────────
const CharacterRegistry = ({ chars, onSave }) => {
  const empty={name:"",role:"Protagonist",appearance:"",voiceTone:"",accent:"",personality:""};
  const [form,setForm]=useState(empty);
  const [editing,setEditing]=useState(null);
  const [saving,setSaving]=useState(false);
  const roles=["Protagonist","Antagonist","Supporting","Narrator","Recurring"];
  const saveChar=async()=>{
    if(!form.name.trim()) return;
    setSaving(true);
    const updated=editing!==null?chars.map((c,i)=>i===editing?{...form,id:c.id}:c):[...chars,{...form,id:Date.now()}];
    await onSave(updated);setForm(empty);setEditing(null);setSaving(false);
  };
  const del=async(id)=>onSave(chars.filter(c=>c.id!==id));
  const edit=(i)=>{setForm(chars[i]);setEditing(i);};
  const F=({k,label,ph,rows=1})=>(
    <div style={{marginBottom:11}}>
      <label style={{color:"#9ca3af",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:4}}>{label}</label>
      {rows>1
        ?<textarea value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} placeholder={ph} rows={rows} style={{width:"100%",background:"#0f172a",border:"1px solid #374151",borderRadius:8,color:"#e5e7eb",fontSize:13,padding:"8px 11px",resize:"vertical",outline:"none",boxSizing:"border-box",fontFamily:"inherit",lineHeight:1.6}}/>
        :<input value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} placeholder={ph} style={{width:"100%",background:"#0f172a",border:"1px solid #374151",borderRadius:8,color:"#e5e7eb",fontSize:13,padding:"8px 11px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
      }
    </div>
  );
  return(
    <div>
      <div style={{color:"#9ca3af",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:16}}>
        {chars.length} Character{chars.length!==1?"s":""} — auto-injected into every story you generate
      </div>
      {chars.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:22}}>
          {chars.map((c,i)=>{
            const rc={Protagonist:"#10b981",Antagonist:"#ef4444",Supporting:"#3b82f6",Narrator:"#f59e0b",Recurring:"#a855f7"}[c.role]||"#6b7280";
            return(
              <div key={c.id} style={{background:"#0f172a",border:`1px solid ${rc}44`,borderRadius:12,padding:"13px 15px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{background:rc,color:"#000",fontSize:10,fontWeight:800,borderRadius:20,padding:"2px 8px"}}>{c.role}</span>
                    <span style={{color:"#fff",fontWeight:800,fontSize:15}}>{c.name}</span>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>edit(i)} style={{background:"#1e3a5f",border:"1px solid #3b82f6",borderRadius:6,color:"#60a5fa",fontSize:11,padding:"2px 9px",cursor:"pointer"}}>Edit</button>
                    <button onClick={()=>del(c.id)} style={{background:"transparent",border:"1px solid #374151",borderRadius:6,color:"#6b7280",fontSize:11,padding:"2px 9px",cursor:"pointer"}}>Delete</button>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"5px 14px"}}>
                  {[["APPEARANCE",c.appearance],["VOICE",c.voiceTone],["ACCENT",c.accent],["PERSONALITY",c.personality]].map(([lbl,val])=>val?(
                    <div key={lbl}><span style={{color:rc,fontSize:9,fontWeight:700}}>{lbl}: </span><span style={{color:"#9ca3af",fontSize:11}}>{val.slice(0,70)}{val.length>70?"...":""}</span></div>
                  ):null)}
                </div>
              </div>
            );
          })}
        </div>
      )}
      <div style={{background:"linear-gradient(135deg,#1f2937,#111827)",border:"1px solid #374151",borderRadius:14,padding:20}}>
        <div style={{color:"#f59e0b",fontWeight:800,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>{editing!==null?"✏️ Edit Character":"➕ Add Character"}</div>
        <div style={{marginBottom:12}}>
          <label style={{color:"#9ca3af",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:5}}>Role</label>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{roles.map(r=><button key={r} onClick={()=>setForm(f=>({...f,role:r}))} style={{background:form.role===r?"#1e3a5f":"#111827",border:`1px solid ${form.role===r?"#3b82f6":"#374151"}`,borderRadius:20,color:form.role===r?"#60a5fa":"#6b7280",fontSize:11,padding:"4px 11px",cursor:"pointer"}}>{r}</button>)}</div>
        </div>
        <F k="name" label="Character Name" ph="e.g. Dan Karami"/>
        <F k="appearance" label="Physical Appearance (T2I)" ph="e.g. Tall elderly West African man, white kufi, warm eyes, dark robe..." rows={2}/>
        <F k="voiceTone" label="Voice Tone (ElevenLabs-ready)" ph="e.g. Deep, measured baritone — slow and deliberate, weight of wisdom in every word" rows={2}/>
        <F k="accent" label="Accent / Speech Style" ph="e.g. Northern Nigerian Hausa accent, formal but warm"/>
        <F k="personality" label="Personality &amp; Traits" ph="e.g. Wise, patient, quietly fierce — speaks in proverbs under pressure" rows={2}/>
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <button onClick={saveChar} disabled={!form.name.trim()||saving} style={{background:!form.name.trim()?"#374151":"linear-gradient(135deg,#f59e0b,#ef4444)",border:"none",borderRadius:10,color:"#fff",fontWeight:800,fontSize:13,padding:"9px 22px",cursor:!form.name.trim()?"not-allowed":"pointer"}}>
            {saving?"Saving...":(editing!==null?"Update Character":"Add to Registry")}
          </button>
          {editing!==null&&<button onClick={()=>{setForm(empty);setEditing(null);}} style={{background:"transparent",border:"1px solid #374151",borderRadius:10,color:"#6b7280",fontSize:13,padding:"9px 14px",cursor:"pointer"}}>Cancel</button>}
        </div>
      </div>
    </div>
  );
};

// ── Settings ───────────────────────────────────────────────────────────────────
const Settings = ({ elApiKey, elVoiceId, anthropicKey, onSave }) => {
  const [key, setKey]         = useState(elApiKey || "");
  const [voice, setVoice]     = useState(elVoiceId || "");
  const [aKey, setAKey]       = useState(anthropicKey || "");
  const [saved, setSaved]     = useState(false);
  const [loaded, setLoaded]   = useState(false);
  const [customVoices, setCustomVoices] = useState([]);
  const [newName, setNewName] = useState("");
  const [newId, setNewId]     = useState("");

  const DEFAULT_VOICES = [
    {voice_id:"21m00Tcm4TlvDq8ikWAM", name:"Rachel", category:"ElevenLabs Default"},
    {voice_id:"pNInz6obpgDQGcFmaJgB", name:"Adam",   category:"ElevenLabs Default"},
    {voice_id:"ErXwobaYiN019PkySvjV", name:"Antoni", category:"ElevenLabs Default"},
    {voice_id:"VR6AewLTigWG4xSOukaG", name:"Arnold", category:"ElevenLabs Default"},
    {voice_id:"EXAVITQu4vr4xnSDxMaL", name:"Bella",  category:"ElevenLabs Default"},
    {voice_id:"MF3mGyEYCl7XYWbV9V6O", name:"Elli",   category:"ElevenLabs Default"},
  ];

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("el_settings");
        if (r?.value) {
          const s = JSON.parse(r.value);
          if (s.key)          { setKey(s.key); setLoaded(true); }
          if (s.voiceId)      setVoice(s.voiceId);
          if (s.customVoices) setCustomVoices(s.customVoices);
          if (s.anthropicKey) setAKey(s.anthropicKey);
        }
      } catch {}
    })();
  }, []);

  const allVoices = [...customVoices, ...DEFAULT_VOICES];
  const selectedVoice = allVoices.find(v => v.voice_id === voice);

  const addCustomVoice = async () => {
    if (!newName.trim() || !newId.trim()) return;
    const updated = [{voice_id: newId.trim(), name: newName.trim(), category:"Your Voice"}, ...customVoices];
    setCustomVoices(updated);
    setVoice(newId.trim());
    setNewName(""); setNewId("");
    await window.storage.set("el_settings", JSON.stringify({key, voiceId: newId.trim(), customVoices: updated, anthropicKey: aKey}));
  };

  const removeCustomVoice = async (id) => {
    const updated = customVoices.filter(v => v.voice_id !== id);
    setCustomVoices(updated);
    if (voice === id) setVoice(updated[0]?.voice_id || DEFAULT_VOICES[0].voice_id);
    await window.storage.set("el_settings", JSON.stringify({key, voiceId: voice, customVoices: updated, anthropicKey: aKey}));
  };

  const save = async () => {
    await window.storage.set("el_settings", JSON.stringify({key: key.trim(), voiceId: voice, customVoices, anthropicKey: aKey.trim()}));
    onSave(key.trim(), voice, aKey.trim());
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{background:"linear-gradient(135deg,#1f2937,#111827)",border:"1px solid #374151",borderRadius:14,padding:22,maxWidth:560}}>
      <div style={{color:"#f59e0b",fontWeight:800,fontSize:13,textTransform:"uppercase",letterSpacing:1,marginBottom:18}}>⚙️ Settings</div>

      {loaded && <div style={{background:"#064e3b",border:"1px solid #10b98155",borderRadius:8,padding:"7px 12px",marginBottom:14,color:"#34d399",fontSize:12,fontWeight:700}}>✅ Settings loaded from this browser</div>}

      {/* Anthropic Key */}
      <div style={{background:"#0a1020",border:"1px solid #f59e0b44",borderRadius:12,padding:16,marginBottom:18}}>
        <div style={{color:"#fbbf24",fontWeight:800,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>🔑 Anthropic API Key (required to generate)</div>
        <div style={{color:"#6b7280",fontSize:11,marginBottom:10,lineHeight:1.6}}>
          Needed to write scripts, regenerate scenes, and generate Facebook posts. Stored only in this browser, never sent anywhere except Anthropic. Get one at <strong style={{color:"#9ca3af"}}>console.anthropic.com/settings/keys</strong>.
        </div>
        <input type="password" value={aKey} onChange={e=>setAKey(e.target.value)} placeholder="sk-ant-..."
          style={{width:"100%",background:"#0f172a",border:`1px solid ${aKey?"#f59e0b66":"#374151"}`,borderRadius:8,color:"#e5e7eb",fontSize:13,padding:"9px 12px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
      </div>

      {/* API Key */}
      <div style={{marginBottom:18}}>
        <label style={{color:"#9ca3af",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>ElevenLabs API Key</label>
        <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="Paste your ElevenLabs API key..."
          style={{width:"100%",background:"#0f172a",border:`1px solid ${key?"#10b98166":"#374151"}`,borderRadius:8,color:"#e5e7eb",fontSize:13,padding:"9px 12px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
        <div style={{color:"#4b5563",fontSize:11,marginTop:4}}>elevenlabs.io → Profile → API Key</div>
      </div>

      {/* Add your own voices */}
      <div style={{background:"#0a1020",border:"1px solid #7c3aed44",borderRadius:12,padding:16,marginBottom:18}}>
        <div style={{color:"#a78bfa",fontWeight:800,fontSize:12,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>🎙️ Add Your ElevenLabs Voices</div>
        <div style={{color:"#6b7280",fontSize:11,marginBottom:12,lineHeight:1.6}}>
          In ElevenLabs → <strong style={{color:"#9ca3af"}}>Voices</strong> → click your voice → copy the <strong style={{color:"#9ca3af"}}>Voice ID</strong> from the bottom of the panel.
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Voice name (e.g. My Narrator)"
            style={{flex:"1 1 140px",background:"#0f172a",border:"1px solid #374151",borderRadius:8,color:"#e5e7eb",fontSize:12,padding:"7px 10px",outline:"none",fontFamily:"inherit"}}/>
          <input value={newId} onChange={e=>setNewId(e.target.value)} placeholder="Voice ID (paste here)"
            style={{flex:"2 1 200px",background:"#0f172a",border:"1px solid #374151",borderRadius:8,color:"#e5e7eb",fontSize:12,padding:"7px 10px",outline:"none",fontFamily:"inherit"}}/>
          <button onClick={addCustomVoice} disabled={!newName.trim()||!newId.trim()}
            style={{background:"linear-gradient(135deg,#7c3aed,#4338ca)",border:"none",borderRadius:8,color:"#fff",fontSize:12,fontWeight:700,padding:"7px 16px",cursor:!newName.trim()||!newId.trim()?"not-allowed":"pointer",whiteSpace:"nowrap"}}>
            ➕ Add
          </button>
        </div>

        {/* Custom voice list */}
        {customVoices.length > 0 && (
          <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:6}}>
            {customVoices.map(v => (
              <div key={v.voice_id} style={{background:"#111827",border:`1px solid ${voice===v.voice_id?"#7c3aed":"#1f2937"}`,borderRadius:8,padding:"7px 11px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{cursor:"pointer"}} onClick={()=>setVoice(v.voice_id)}>
                  <span style={{color:voice===v.voice_id?"#a78bfa":"#e5e7eb",fontWeight:700,fontSize:13}}>{v.name}</span>
                  <span style={{color:"#4b5563",fontSize:10,marginLeft:8,fontFamily:"monospace"}}>{v.voice_id.slice(0,16)}…</span>
                </div>
                <button onClick={()=>removeCustomVoice(v.voice_id)} style={{background:"transparent",border:"none",color:"#6b7280",fontSize:12,cursor:"pointer",padding:"0 4px"}}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Voice selector — all voices */}
      <div style={{marginBottom:18}}>
        <label style={{color:"#9ca3af",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>
          Active Voice {selectedVoice && <span style={{color:"#6b7280",fontWeight:400,textTransform:"none"}}>— {selectedVoice.name}</span>}
        </label>
        <select value={voice} onChange={e=>setVoice(e.target.value)}
          style={{width:"100%",background:"#0f172a",border:"1px solid #374151",borderRadius:8,color:"#e5e7eb",fontSize:13,padding:"9px 12px",outline:"none",boxSizing:"border-box"}}>
          {customVoices.length > 0 && (
            <optgroup label="🎙️ Your Voices">
              {customVoices.map(v=><option key={v.voice_id} value={v.voice_id}>{v.name}</option>)}
            </optgroup>
          )}
          <optgroup label="📦 ElevenLabs Defaults">
            {DEFAULT_VOICES.map(v=><option key={v.voice_id} value={v.voice_id}>{v.name}</option>)}
          </optgroup>
        </select>
      </div>

      <button onClick={save}
        style={{background:"linear-gradient(135deg,#7c3aed,#4338ca)",border:"none",borderRadius:10,color:"#fff",fontWeight:700,fontSize:13,padding:"9px 22px",cursor:"pointer"}}>
        {saved ? "✅ Saved!" : "Save Settings"}
      </button>
    </div>
  );
};

// ── Library Card ──────────────────────────────────────────────────────────────

// ── Main App ───────────────────────────────────────────────────────────────────
function App() {
  const [idea,setIdea]=useState("");
  const [context,setContext]=useState("");
  const [showCtx,setShowCtx]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [progress,setProg]=useState("");
  const [library,setLibrary]=useState([]);
  const [storyCache,setStoryCache]=useState({});
  const [activeId,setActiveId]=useState(null);
  const [view,setView]=useState("write");
  const [ready,setReady]=useState(false);
  const [characters,setCharacters]=useState([]);
  const [elApiKey,setElApiKey]=useState("");
  const [elVoiceId,setElVoiceId]=useState("21m00Tcm4TlvDq8ikWAM");
  const [anthropicKey,setAnthropicKey]=useState("");
  const [trackers,setTrackers]=useState({});
  const resultRef=useRef(null);

  useEffect(()=>{
    (async()=>{
      try{const r=await window.storage.get("library_index");if(r?.value)setLibrary(JSON.parse(r.value));}catch{}
      try{const r=await window.storage.get("char_registry");if(r?.value)setCharacters(JSON.parse(r.value));}catch{}
      try{const r=await window.storage.get("el_settings");if(r?.value){const s=JSON.parse(r.value);setElApiKey(s.key||"");setElVoiceId(s.voiceId||"21m00Tcm4TlvDq8ikWAM");setAnthropicKey(s.anthropicKey||"");}}catch{}
      setReady(true);
    })();
  },[]);

  const saveChars=async(u)=>{await window.storage.set("char_registry",JSON.stringify(u));setCharacters(u);};
  const saveElSettings=async(k,v,ak)=>{setElApiKey(k);setElVoiceId(v);setAnthropicKey(ak);};

  const getTracker=async(id)=>{
    if(trackers[id]) return trackers[id];
    try{const r=await window.storage.get(`tracker:${id}`);if(r?.value){const t=JSON.parse(r.value);setTrackers(p=>({...p,[id]:t}));return t;}}catch{}
    const e={};setTrackers(p=>({...p,[id]:e}));return e;
  };

  const updateStage=async(sid,snum,idx)=>{
    const t={...(trackers[sid]||{}),[snum]:idx};
    await window.storage.set(`tracker:${sid}`,JSON.stringify(t));
    setTrackers(p=>({...p,[sid]:t}));
  };

  const saveToStorage=async(entry,fullData)=>{
    const nl=[entry,...library];
    await window.storage.set("library_index",JSON.stringify(nl));
    await window.storage.set(`story:${entry.id}`,JSON.stringify(fullData));
    setLibrary(nl);setStoryCache(c=>({...c,[entry.id]:fullData}));
  };

  const loadStory=async(id)=>{
    if(storyCache[id]) return storyCache[id];
    try{const r=await window.storage.get(`story:${id}`);if(r?.value){const d=JSON.parse(r.value);setStoryCache(c=>({...c,[id]:d}));return d;}}catch{}
    return null;
  };

  const deleteStory=async(id)=>{
    const u=library.filter(e=>e.id!==id);
    await window.storage.set("library_index",JSON.stringify(u));
    try{await window.storage.delete(`story:${id}`);}catch{}
    try{await window.storage.delete(`tracker:${id}`);}catch{}
    setLibrary(u);setStoryCache(c=>{const n={...c};delete n[id];return n;});
    if(activeId===id)setActiveId(u[0]?.id||null);
  };

  const selectStory=async(id)=>{setActiveId(id);await loadStory(id);await getTracker(id);setView("write");setTimeout(()=>resultRef.current?.scrollIntoView({behavior:"smooth"}),100);};

  const rescan=async()=>{
    setProg("🔍 Scanning...");setLoading(true);
    try{
      const keys=(await window.storage.list("story:"))?.keys||[];
      const entries=[];
      for(const key of keys){try{const r=await window.storage.get(key);if(r?.value){const d=JSON.parse(r.value);const id=parseInt(key.replace("story:",""));entries.push({id,title:d.title||"Untitled",genre:d.genre||"Drama",synopsis:d.synopsis||"",idea:d.idea||"",scenes:d.scenes?.length||0,savedAt:id});setStoryCache(c=>({...c,[id]:d}));}}catch{}}
      entries.sort((a,b)=>b.savedAt-a.savedAt);
      await window.storage.set("library_index",JSON.stringify(entries));
      setLibrary(entries);setView("library");
    }catch(e){setError("Rescan failed: "+e.message);}
    setLoading(false);setProg("");
  };

  const generate=async()=>{
    if(!idea.trim()) return;
    if(!anthropicKey.trim()){setError("Add your Anthropic API key in Settings (⚙️) first.");return;}
    setLoading(true);setError("");setProg("✍️ Crafting your story...");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:ANTHROPIC_HEADERS(anthropicKey),
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:8000,system:buildSystemPrompt(context.trim(),characters),messages:[{role:"user",content:`Story idea / production brief:\n\n${idea}`}]})
      });
      setProg("🎬 Building scenes...");
      const json=await res.json();
      const raw=json.content?.find(b=>b.type==="text")?.text||"";
      let clean=raw.replace(/```json|```/g,"").trim();
      let parsed;
      try{parsed=JSON.parse(clean);}
      catch{const cut=Math.max(clean.lastIndexOf('},\n    {')+1,clean.lastIndexOf('}')+1);let rep=clean.slice(0,cut);rep+=']'.repeat(Math.max(0,(rep.match(/\[/g)||[]).length-(rep.match(/\]/g)||[]).length));rep+='}'.repeat(Math.max(0,(rep.match(/{/g)||[]).length-(rep.match(/}/g)||[]).length));parsed=JSON.parse(rep);}
      const id=Date.now();
      const entry={id,title:parsed.title,genre:parsed.genre,synopsis:parsed.synopsis,idea:idea.slice(0,120),scenes:parsed.scenes?.length||0,savedAt:id};
      setProg("💾 Saving...");
      await saveToStorage(entry,parsed);
      setActiveId(id);setIdea("");setView("write");
      setTimeout(()=>resultRef.current?.scrollIntoView({behavior:"smooth"}),150);
    }catch(e){setError("Something went wrong. "+e.message);}
    setLoading(false);setProg("");
  };

  const activeStory=storyCache[activeId];
  const activeTracker=trackers[activeId]||{};
  const TABS=[{id:"write",label:"✍️ Write"},{id:"library",label:`📚 Library${library.length?` (${library.length})`:""}`},{id:"characters",label:`👥 Characters${characters.length?` (${characters.length})`:""}`},{id:"settings",label:"⚙️ Settings"}];

  return(
    <div style={{minHeight:"100vh",background:"#030712",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#f9fafb"}}>
      <div style={{background:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)",padding:"16px 20px",borderBottom:"1px solid #1f2937"}}>
        <div style={{maxWidth:920,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div>
            <h1 style={{margin:0,fontSize:19,fontWeight:900,background:"linear-gradient(90deg,#f59e0b,#ec4899,#3b82f6)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>🎬 Story &amp; Script Production Studio</h1>
            <p style={{color:"#6b7280",margin:"2px 0 0",fontSize:11}}>Idea → cinematic script → production ready · saved forever</p>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            <button onClick={rescan} disabled={loading} title="Rescan &amp; rebuild library" style={{background:"#1f2937",border:"1px solid #374151",borderRadius:8,color:"#9ca3af",padding:"6px 11px",cursor:"pointer",fontSize:13}}>🔄</button>
            {TABS.map(t=><button key={t.id} onClick={()=>setView(t.id)} style={{background:view===t.id?"#1e3a5f":"#1f2937",border:`1px solid ${view===t.id?"#3b82f6":"#374151"}`,borderRadius:8,color:view===t.id?"#60a5fa":"#9ca3af",padding:"6px 13px",cursor:"pointer",fontSize:11,fontWeight:700}}>{t.label}</button>)}
          </div>
        </div>
      </div>

      <div style={{maxWidth:920,margin:"0 auto",padding:"20px 18px"}}>

        {view==="library"&&<div><div style={{color:"#9ca3af",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>{library.length?`${library.length} Stor${library.length===1?"y":"ies"}`:"No stories yet"}</div><div style={{display:"flex",flexDirection:"column",gap:10}}>{library.map(e=><LibraryCard key={e.id} entry={e} active={activeId===e.id} onSelect={()=>selectStory(e.id)} onDelete={()=>deleteStory(e.id)}/>)}</div></div>}

        {view==="characters"&&<CharacterRegistry chars={characters} onSave={saveChars}/>}

        {view==="settings"&&<Settings elApiKey={elApiKey} elVoiceId={elVoiceId} anthropicKey={anthropicKey} onSave={saveElSettings}/>}

        {view==="write"&&(
          <>
            <div style={{background:"linear-gradient(135deg,#1f2937,#111827)",border:"1px solid #374151",borderRadius:16,padding:20,marginBottom:22}}>
              <label style={{display:"block",fontWeight:700,fontSize:14,color:"#f59e0b",marginBottom:9,letterSpacing:0.5}}>💡 YOUR STORY IDEA / PRODUCTION BRIEF</label>
              <textarea value={idea} onChange={e=>setIdea(e.target.value)} placeholder="Describe your story idea, or paste a full production booklet for a sequel/continuation..." rows={4}
                style={{width:"100%",background:"#0f172a",border:"1px solid #374151",borderRadius:10,color:"#e5e7eb",fontSize:14,padding:"13px 15px",lineHeight:1.7,resize:"vertical",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
              {characters.length>0&&<div style={{marginTop:9,padding:"7px 11px",background:"#0f172a",border:"1px solid #10b98144",borderRadius:8}}><span style={{color:"#34d399",fontSize:11,fontWeight:700}}>👥 Characters auto-injected: </span><span style={{color:"#6b7280",fontSize:11}}>{characters.map(c=>c.name).join(", ")}</span></div>}
              <div style={{marginTop:11}}>
                <button onClick={()=>setShowCtx(s=>!s)} style={{background:"transparent",border:`1px solid ${showCtx?"#7c3aed":"#374151"}`,borderRadius:8,color:showCtx?"#a78bfa":"#6b7280",fontSize:12,fontWeight:700,padding:"5px 13px",cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
                  <span>{showCtx?"▲":"▼"}</span>📌 {showCtx?"Hide":"Add"} Story Context {context.trim()?"(loaded ✓)":"(for sequels)"}
                </button>
                {showCtx&&<div style={{marginTop:9}}><div style={{color:"#6b7280",fontSize:12,marginBottom:6}}>Previous season synopsis or world-building to treat as canon.</div><textarea value={context} onChange={e=>setContext(e.target.value)} placeholder="Season 1 synopsis, key events, world rules..." rows={4} style={{width:"100%",background:"#0f172a",border:"1px solid #7c3aed55",borderRadius:10,color:"#e5e7eb",fontSize:13,padding:"11px 13px",lineHeight:1.7,resize:"vertical",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/></div>}
              </div>
              {!anthropicKey.trim()&&<div style={{marginTop:11,padding:"8px 12px",background:"#3a2a0a",border:"1px solid #f59e0b55",borderRadius:8,color:"#fcd34d",fontSize:12}}>🔑 Add your Anthropic API key in <strong>⚙️ Settings</strong> before generating.</div>}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:13,flexWrap:"wrap",gap:9}}>
                <span style={{color:"#4b5563",fontSize:12}}>{ready&&library.length>0?`📚 ${library.length} stor${library.length===1?"y":"ies"} saved`:"Stories saved permanently"}</span>
                <button onClick={generate} disabled={loading||!idea.trim()} style={{background:loading?"#374151":"linear-gradient(135deg,#f59e0b,#ef4444)",border:"none",borderRadius:10,color:"#fff",fontWeight:800,fontSize:14,padding:"11px 26px",cursor:loading||!idea.trim()?"not-allowed":"pointer",transition:"all .2s"}}>{loading?progress||"Generating...":"🚀 Generate Script"}</button>
              </div>
            </div>

            {loading&&<div style={{textAlign:"center",padding:"34px 0"}}><div style={{fontSize:34,marginBottom:9}}>🎭</div><div style={{color:"#f59e0b",fontWeight:700,fontSize:15}}>{progress}</div><div style={{color:"#6b7280",fontSize:12,marginTop:4}}>Crafting scenes with full production specs...</div></div>}
            {error&&<div style={{background:"#7f1d1d",border:"1px solid #ef4444",borderRadius:10,padding:13,color:"#fca5a5",marginBottom:18}}>⚠️ {error}</div>}

            {library.length > 1 && (
              <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
                {library.slice(0,6).map(e => {
                  const c = genreColor(e.genre);
                  return (
                    <button key={e.id} onClick={()=>selectStory(e.id)}
                      style={{background:activeId===e.id?`${c}22`:"#1f2937",border:`1px solid ${activeId===e.id?c:"#374151"}`,borderRadius:20,color:activeId===e.id?c:"#9ca3af",padding:"4px 11px",cursor:"pointer",fontSize:11,fontWeight:600,maxWidth:155,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {activeId===e.id?"▶ ":""}{e.title}
                    </button>
                  );
                })}
                {library.length > 6 && (
                  <button onClick={()=>setView("library")} style={{background:"#1f2937",border:"1px solid #374151",borderRadius:20,color:"#6b7280",padding:"4px 11px",cursor:"pointer",fontSize:11}}>
                    +{library.length-6} more →
                  </button>
                )}
              </div>
            )}

            {activeStory&&<div ref={resultRef}>
              <StoryView data={activeStory} elApiKey={elApiKey} elVoiceId={elVoiceId} anthropicKey={anthropicKey}
                tracker={activeTracker}
                onStageChange={(sn,si)=>updateStage(activeId,sn,si)}
                onSave={async(u)=>{await window.storage.set(`story:${activeId}`,JSON.stringify(u));setStoryCache(c=>({...c,[activeId]:u}));setLibrary(l=>l.map(e=>e.id===activeId?{...e,scenes:u.scenes?.length||e.scenes}:e));}}
              />
            </div>}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
